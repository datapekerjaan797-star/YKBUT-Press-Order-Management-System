<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKBUT Press Order Management System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Phosphor Icons (Professional Icon Set) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Konfigurasi Tema Tailwind ala UT -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'corp-primary': '#1D4ED8', // Biru Tua (Blue-700)
                        'corp-dark': '#0F172A', // Slate-900 (Sangat gelap kebiruan) untuk sidebar
                        'corp-light': '#F3F4F6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Gaya tambahan untuk scrollbar agar lebih profesional */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #888; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }

        /* Styling spesifik untuk saat mencetak dokumen (Print Receipt) */
        @media print {
            body * {
                visibility: hidden; /* Sembunyikan semua elemen */
            }
            #print-area, #print-area * {
                visibility: visible; /* Tampilkan hanya area print */
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                color: black;
            }
            /* Hilangkan warna background agar hemat tinta */
            .print-bg-none { background: none !important; }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden relative">

    <!-- Login Screen Overlay -->
    <div id="login-screen" class="fixed inset-0 bg-corp-dark z-50 flex items-center justify-center transition-all duration-500">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 relative overflow-hidden fade-in">
            <div class="absolute top-0 left-0 w-full h-2 bg-corp-primary"></div>
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-gray-800 tracking-tight mb-1">YKBUT</h1>
                <span class="text-sm text-corp-primary font-bold tracking-[0.2em] uppercase block">Press System</span>
                <p class="text-gray-500 text-sm mt-4">Silakan masuk menggunakan kredensial Anda</p>
            </div>
            <form id="form-login" onsubmit="app.handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                    <div class="relative">
                        <i class="ph ph-user absolute left-3 top-2.5 text-gray-400 text-xl"></i>
                        <input type="text" id="login-username" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none transition" placeholder="admin">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <i class="ph ph-lock absolute left-3 top-2.5 text-gray-400 text-xl"></i>
                        <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none transition" placeholder="12345">
                    </div>
                </div>
                <div id="login-error" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100 flex items-center">
                    <i class="ph ph-warning-circle mr-2 text-lg"></i> Username atau Password salah!
                </div>
                <button type="submit" class="w-full bg-corp-primary text-white font-bold py-2.5 rounded-lg hover:bg-blue-800 transition shadow-lg mt-4">
                    Masuk ke Sistem
                </button>
            </form>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-64 bg-corp-dark text-white flex flex-col shadow-2xl z-20 transition-all duration-300">
        <!-- Logo / Title -->
        <div class="h-20 flex items-center justify-center border-b border-gray-700 px-4 pt-2 pb-2">
            <div class="text-center">
                <h1 class="text-white font-black text-2xl tracking-wider leading-none">YKBUT</h1>
                <span class="text-xs text-corp-primary font-bold tracking-[0.2em] uppercase mt-1 block">Press System</span>
            </div>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 px-4 py-6 space-y-2">
            <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="w-full flex items-center px-4 py-3 bg-corp-primary text-white rounded-lg font-semibold transition-colors">
                <i class="ph ph-squares-four text-xl mr-3"></i> Dashboard
            </button>
            <button onclick="app.navigate('orders')" id="nav-orders" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors">
                <i class="ph ph-shopping-cart text-xl mr-3"></i> Data Pemesanan
            </button>
            <button onclick="app.navigate('add-order')" id="nav-add-order" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors">
                <i class="ph ph-plus-circle text-xl mr-3"></i> Pesanan Baru
            </button>
            <button onclick="app.navigate('books')" id="nav-books" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors">
                <i class="ph ph-books text-xl mr-3"></i> Katalog Buku
            </button>
            <button onclick="app.navigate('users')" id="nav-users" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors hidden">
                <i class="ph ph-users text-xl mr-3"></i> Manajemen User
            </button>
        </nav>

        <div class="p-4 border-t border-gray-700 flex justify-between items-center">
            <div class="flex items-center text-sm text-gray-400">
                <i class="ph ph-user-circle text-2xl mr-2 text-corp-primary"></i>
                <div>
                    <p class="font-semibold text-white" id="sidebar-user-name">Admin YKBUT</p>
                    <p class="text-xs" id="sidebar-user-role">Administrator</p>
                </div>
            </div>
            <button onclick="app.logout()" class="text-gray-400 hover:text-red-500 transition" title="Logout">
                <i class="ph ph-sign-out text-xl"></i>
            </button>
        </div>
    </aside>

    <!-- Main Content wrapper -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <!-- Top Header -->
        <header class="h-20 bg-white border-b-4 border-corp-primary shadow-sm flex items-center justify-between px-8 z-10">
            <h2 class="text-xl font-bold text-gray-700" id="page-title">Dashboard Analitik</h2>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-gray-500 flex items-center">
                    <i class="ph ph-calendar-blank mr-2 text-lg"></i>
                    <span id="current-date"></span>
                </span>
                <button class="p-2 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 relative">
                    <i class="ph ph-bell text-xl"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-8" id="app-content">
            <!-- Konten akan dirender oleh JavaScript disini -->
        </main>
    </div>

    <!-- Modal Root untuk Popups -->
    <div id="modal-root"></div>

    <!-- Print Area -->
    <div id="print-area" class="hidden p-8 font-sans">
        <!-- Konten kwitansi akan diinject via JS -->
    </div>

    <!-- Javascript Application Logic -->
    <script>
        // 1. Data Mockup & State Management
        let mockUsers = [
            { id: 'U001', username: 'admin', password: '12345', role: 'Administrator', name: 'Admin Utama' },
            { id: 'U002', username: 'staff', password: '123', role: 'Staff Operasional', name: 'Petugas Kasir' }
        ];
        
        let currentUser = null;

        let mockBooks = [
            { id: 'B001', title: 'Manajemen Alat Berat Terpadu', author: 'Ir. Budi Santoso', pages: 320, category: 'Manajemen', costPrice: 100000, defaultPrice: 150000, margin: 50000, stock: 100 },
            { id: 'B002', title: 'Dasar-dasar Hidrolik', author: 'Ahmad Teknik, MT', pages: 250, category: 'Teknik', costPrice: 85000, defaultPrice: 125000, margin: 40000, stock: 85 },
            { id: 'B003', title: 'Keselamatan Kerja Pertambangan', author: 'Dr. Safety First', pages: 180, category: 'K3', costPrice: 60000, defaultPrice: 90000, margin: 30000, stock: 200 },
            { id: 'B004', title: 'Leadership di Lapangan', author: 'HR YKBUT', pages: 210, category: 'Manajemen', costPrice: 75000, defaultPrice: 110000, margin: 35000, stock: 50 },
            { id: 'B005', title: 'Panduan Maintenance Engine Diesel', author: 'Tim Mekanik Ahli', pages: 400, category: 'Teknik', costPrice: 120000, defaultPrice: 175000, margin: 55000, stock: 40 }
        ];

        // Status enum
        const ORDER_STATUS = { NEW: 'Pesanan Baru', PROCESSED: 'Diproses', SHIPPING: 'Pengiriman', COMPLETED: 'Selesai' };
        const PAYMENT_STATUS = { UNPAID: 'Belum Bayar', DP: 'DP / Sebagian', PAID: 'Lunas' };

        // Dummy Orders
        let appData = {
            orders: [
                { id: 'ORD-001', date: '2026-09-10', customerName: 'PT. Andalan Maju', customerPhone: '08123456789', customerEmail: 'info@andalan.co.id', customerAddress: 'Jl. Sudirman No 1, Jakarta Pusat', bookId: 'B001', qty: 10, unitPrice: 150000, totalPrice: 1500000, status: ORDER_STATUS.COMPLETED, paymentStatus: PAYMENT_STATUS.PAID, dpAmount: 0, shippingVendor: 'JNE', trackingNumber: 'JNE1234567890' },
                { id: 'ORD-002', date: '2026-09-11', customerName: 'Budi Santoso', customerPhone: '08987654321', customerEmail: 'budi.s@gmail.com', customerAddress: 'Komp. Harapan Jaya, Bekasi', bookId: 'B003', qty: 2, unitPrice: 90000, totalPrice: 180000, status: ORDER_STATUS.NEW, paymentStatus: PAYMENT_STATUS.UNPAID, dpAmount: 0, shippingVendor: '', trackingNumber: '' },
                { id: 'ORD-003', date: '2026-09-11', customerName: 'CV. Bangun Konstruksi', customerPhone: '08112233445', customerEmail: 'procurement@bangun.com', customerAddress: 'Kawasan Industri Cikarang Blok C2', bookId: 'B005', qty: 5, unitPrice: 170000, totalPrice: 850000, status: ORDER_STATUS.PROCESSED, paymentStatus: PAYMENT_STATUS.DP, dpAmount: 400000, shippingVendor: '', trackingNumber: '' },
            ]
        };

        // Chart Instance referensi
        let statusChartInstance = null;

        // Utility: Format Rupiah
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        };

        // Utility: Get Book By ID
        const getBook = (id) => mockBooks.find(b => b.id === id);

        // 2. Application Core (Router & View Renderer)
        const app = {
            currentView: 'dashboard',
            
            init() {
                this.checkAuth();
            },

            checkAuth() {
                const loginScreen = document.getElementById('login-screen');
                if(!currentUser) {
                    loginScreen.classList.remove('hidden');
                    loginScreen.classList.add('flex');
                } else {
                    loginScreen.classList.add('hidden');
                    loginScreen.classList.remove('flex');
                    
                    document.getElementById('sidebar-user-name').innerText = currentUser.name;
                    document.getElementById('sidebar-user-role').innerText = currentUser.role;

                    // Otorisasi: Tampilkan menu user hanya untuk Administrator
                    const navUsersBtn = document.getElementById('nav-users');
                    if (currentUser.role === 'Administrator') {
                        navUsersBtn.classList.remove('hidden');
                    } else {
                        navUsersBtn.classList.add('hidden');
                    }

                    this.updateDate();
                    this.navigate('dashboard');
                }
            },

            handleLogin(e) {
                e.preventDefault();
                const userVal = document.getElementById('login-username').value;
                const passVal = document.getElementById('login-password').value;
                const errorMsg = document.getElementById('login-error');

                const foundUser = mockUsers.find(u => u.username === userVal && u.password === passVal);

                if (foundUser) {
                    currentUser = foundUser;
                    errorMsg.classList.add('hidden');
                    document.getElementById('form-login').reset();
                    this.checkAuth();
                } else {
                    errorMsg.classList.remove('hidden');
                }
            },

            logout() {
                currentUser = null;
                this.checkAuth();
            },

            updateDate() {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', options);
            },

            navigate(view, param = null) {
                // Menjaga sidebar tetap aktif di 'books' saat mode edit/tambah buku
                this.currentView = (view === 'add-book' || view === 'edit-book') ? 'books' : view;
                this.updateNavStyle();
                
                const contentDiv = document.getElementById('app-content');
                const titleElement = document.getElementById('page-title');
                
                contentDiv.innerHTML = ''; // Clear content
                
                // Hancurkan chart lama jika ada agar tidak glitch
                if(statusChartInstance) {
                    statusChartInstance.destroy();
                    statusChartInstance = null;
                }

                switch(view) {
                    case 'dashboard':
                        titleElement.innerText = "Dashboard Analitik";
                        this.renderDashboard(contentDiv);
                        break;
                    case 'orders':
                        titleElement.innerText = "Data Pemesanan Buku";
                        this.renderOrders(contentDiv);
                        break;
                    case 'add-order':
                        titleElement.innerText = "Input Pesanan Baru";
                        this.renderAddOrder(contentDiv);
                        break;
                    case 'books':
                        titleElement.innerText = "Manajemen Katalog Buku";
                        this.renderBooks(contentDiv);
                        break;
                    case 'add-book':
                        titleElement.innerText = "Tambah Buku Baru";
                        this.renderBookForm(contentDiv);
                        break;
                    case 'edit-book':
                        titleElement.innerText = "Edit Data Buku";
                        this.renderBookForm(contentDiv, param);
                        break;
                    case 'users':
                        if(currentUser && currentUser.role === 'Administrator') {
                            titleElement.innerText = "Manajemen Pengguna Sistem";
                            this.renderUsers(contentDiv);
                        } else {
                            titleElement.innerText = "Akses Ditolak";
                            contentDiv.innerHTML = `<div class="text-center py-20"><i class="ph ph-lock-key text-6xl text-red-500 mb-4"></i><h2 class="text-2xl font-bold text-gray-800">Akses Ditolak</h2><p class="text-gray-500">Anda tidak memiliki otorisasi untuk halaman ini.</p></div>`;
                        }
                        break;
                }
            },

            updateNavStyle() {
                const navs = ['dashboard', 'orders', 'add-order', 'books', 'users'];
                navs.forEach(nav => {
                    const btn = document.getElementById(`nav-${nav}`);
                    if(!btn) return;
                    if (nav === this.currentView) {
                        btn.className = "w-full flex items-center px-4 py-3 bg-corp-primary text-white rounded-lg font-semibold shadow-md transition-colors";
                    } else {
                        btn.className = "w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors";
                    }
                });
            },

            renderDashboard(container) {
                // Kalkulasi Stats
                const totalOrdersCount = appData.orders.length;
                const totalBooksSold = appData.orders.reduce((sum, order) => sum + order.qty, 0);
                const totalRevenue = appData.orders.reduce((sum, order) => sum + order.totalPrice, 0);

                // Kalkulasi untuk Chart
                const countNew = appData.orders.filter(o => o.status === ORDER_STATUS.NEW).length;
                const countProcessed = appData.orders.filter(o => o.status === ORDER_STATUS.PROCESSED).length;
                const countShipping = appData.orders.filter(o => o.status === ORDER_STATUS.SHIPPING).length;
                const countCompleted = appData.orders.filter(o => o.status === ORDER_STATUS.COMPLETED).length;

                container.innerHTML = `
                    <div class="fade-in space-y-6">
                        <!-- Stats Row -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-white rounded-xl shadow-sm border-l-4 border-blue-500 p-6 flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-500 mb-1 font-semibold uppercase tracking-wider">Total Transaksi</p>
                                    <h3 class="text-3xl font-bold text-gray-800">${totalOrdersCount}</h3>
                                </div>
                                <div class="bg-blue-50 text-blue-500 p-3 rounded-lg"><i class="ph ph-receipt text-3xl"></i></div>
                            </div>
                            <div class="bg-white rounded-xl shadow-sm border-l-4 border-green-500 p-6 flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-500 mb-1 font-semibold uppercase tracking-wider">Total Nilai Penjualan</p>
                                    <h3 class="text-2xl font-bold text-gray-800">${formatRupiah(totalRevenue)}</h3>
                                </div>
                                <div class="bg-green-50 text-green-500 p-3 rounded-lg"><i class="ph ph-coins text-3xl"></i></div>
                            </div>
                            <div class="bg-white rounded-xl shadow-sm border-l-4 border-corp-primary p-6 flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-500 mb-1 font-semibold uppercase tracking-wider">Buku Terjual</p>
                                    <h3 class="text-3xl font-bold text-gray-800">${totalBooksSold} <span class="text-sm font-normal text-gray-500">Eks</span></h3>
                                </div>
                                <div class="bg-blue-50 text-corp-primary p-3 rounded-lg"><i class="ph ph-books text-3xl"></i></div>
                            </div>
                        </div>

                        <!-- Chart & Map Row -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <!-- Pie Chart -->
                            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                                <h3 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">Status Pemesanan</h3>
                                <div class="relative h-64 w-full flex justify-center">
                                    <canvas id="orderStatusChart"></canvas>
                                </div>
                            </div>
                            
                            <!-- Dummy Map / Sebaran Alamat -->
                            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                                <h3 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2 flex items-center">
                                    <i class="ph ph-map-pin text-corp-primary mr-2 text-xl"></i> Peta Pemesan Terakhir
                                </h3>
                                <div class="space-y-4 max-h-64 overflow-y-auto pr-2">
                                    ${appData.orders.slice().reverse().map(order => {
                                        const book = getBook(order.bookId);
                                        const bookTitle = book ? book.title : 'Buku Dihapus';
                                        return `
                                        <div class="flex items-start bg-gray-50 p-3 rounded-lg border border-gray-100">
                                            <div class="bg-corp-dark text-white p-2 rounded-full mr-3 mt-1">
                                                <i class="ph ph-push-pin-fill"></i>
                                            </div>
                                            <div>
                                                <p class="font-bold text-sm text-gray-800">${order.customerName}</p>
                                                <p class="text-xs text-gray-500 mt-1"><i class="ph ph-map-trifold mr-1"></i>${order.customerAddress}</p>
                                                <div class="mt-2 text-[10px] font-bold bg-white border inline-block px-2 py-1 rounded text-gray-600">Pesanan: ${bookTitle} (${order.qty} eks)</div>
                                                ${order.status === ORDER_STATUS.SHIPPING || order.status === ORDER_STATUS.COMPLETED && order.trackingNumber ? `<div class="mt-1 text-[10px] font-medium text-blue-600"><i class="ph ph-truck"></i> ${order.shippingVendor}: ${order.trackingNumber}</div>` : ''}
                                            </div>
                                        </div>
                                    `}).join('')}
                                    ${appData.orders.length === 0 ? '<p class="text-gray-400 text-sm italic text-center py-4">Belum ada data pemesan.</p>' : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // Render Chart.js
                setTimeout(() => {
                    const ctx = document.getElementById('orderStatusChart');
                    if(ctx) {
                        statusChartInstance = new Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: ['Pesanan Baru', 'Diproses', 'Pengiriman', 'Selesai'],
                                datasets: [{
                                    data: [countNew, countProcessed, countShipping, countCompleted],
                                    backgroundColor: ['#1D4ED8', '#F59E0B', '#8B5CF6', '#10B981'], // Biru, Kuning, Ungu, Hijau
                                    hoverOffset: 4,
                                    borderWidth: 0
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { position: 'bottom' }
                                },
                                cutout: '65%'
                            }
                        });
                    }
                }, 100);
            },

            renderOrders(container) {
                // Badge helper
                const statusBadge = (status) => {
                    if(status === ORDER_STATUS.NEW) return `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold">${status}</span>`;
                    if(status === ORDER_STATUS.PROCESSED) return `<span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs font-bold">${status}</span>`;
                    if(status === ORDER_STATUS.SHIPPING) return `<span class="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs font-bold"><i class="ph ph-truck mr-1"></i>${status}</span>`;
                    return `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">${status}</span>`;
                };

                const paymentBadge = (status) => {
                    if(status === PAYMENT_STATUS.UNPAID) return `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold border border-red-200">${status}</span>`;
                    if(status === PAYMENT_STATUS.DP) return `<span class="bg-orange-100 text-orange-700 px-2 py-1 rounded text-xs font-bold border border-orange-200">${status}</span>`;
                    return `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold border border-green-200">${status}</span>`;
                };

                let tableRows = appData.orders.map((order, index) => {
                    const book = getBook(order.bookId);
                    const bookTitle = book ? book.title : '<span class="text-red-500">Buku tidak ditemukan</span>';
                    return `
                    <tr class="border-b hover:bg-gray-50 transition-colors">
                        <td class="py-3 px-4 text-sm font-medium text-gray-800">${order.id}</td>
                        <td class="py-3 px-4 text-sm text-gray-600">
                            <p class="font-bold text-gray-800">${order.customerName}</p>
                            <p class="text-xs">${order.customerPhone}</p>
                        </td>
                        <td class="py-3 px-4 text-sm text-gray-600 max-w-xs truncate" title="${bookTitle}">${bookTitle} <br><span class="text-xs font-bold text-gray-400">Qty: ${order.qty}</span></td>
                        <td class="py-3 px-4 text-sm font-semibold text-gray-800">${formatRupiah(order.totalPrice)}</td>
                        <td class="py-3 px-4">
                            ${statusBadge(order.status)}
                            ${order.trackingNumber ? `<p class="text-[10px] text-gray-500 mt-1 uppercase">${order.shippingVendor}: ${order.trackingNumber}</p>` : ''}
                        </td>
                        <td class="py-3 px-4">${paymentBadge(order.paymentStatus)}</td>
                        <td class="py-3 px-4 text-center">

            // Fitur Download Excel menggunakan HTML Table to XLS approach
            exportToExcel() {
                let tableHtml = `
                    <table border="1">

                            <th>Nomor Resi</th>

                appData.orders.forEach(order => {

                    tableHtml += `

                            <td>${order.shippingVendor || '-'}</td>
                            <td>${order.trackingNumber || '-'}</td>
                        </tr>
                    `;
                });
                tableHtml += `</table>`;
                
                // Mekanisme Download Excel
                const uri = 'data:application/vnd.ms-excel;base64,';
                const template = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Data Pesanan</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>{table}</body></html>';
                const base64 = function(s) { return window.btoa(unescape(encodeURIComponent(s))) };
                const format = function(s, c) { return s.replace(/{(\w+)}/g, function(m, p) { return c[p]; }) };
                
                const ctx = { worksheet: 'Worksheet', table: tableHtml };
                const link = document.createElement("a");
                link.download = `Data_Pesanan_YKBUT_${new Date().toISOString().slice(0,10)}.xls`;
                link.href = uri + base64(format(template, ctx));
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            },

                const newOrderStatus = document.getElementById('modal-order-status').value;
                const vendor = document.getElementById('modal-vendor').value;
                const resi = document.getElementById('modal-resi').value;

                order.status = newOrderStatus;

                    order.shippingVendor = vendor;
                    order.trackingNumber = resi;

                const selectPay = document.getElementById('pay-status');

                    const qty = parseInt(inputQty.value) || 0;
                    const total = price * qty;
                    labelTotal.innerText = formatRupiah(total);
                };

                selectBook.addEventListener('change', (e) => {
                    const selectedOption = e.target.options[e.target.selectedIndex];
                    if(selectedOption.value !== "") {
                        inputPrice.value = selectedOption.getAttribute('data-price');
                        calculateTotal();
                    } else {

                        <!-- Footer -->
                        <div class="mt-12 pt-8 flex justify-between text-sm text-center">
                            <div>
                                <p class="mb-16">Penerima / YKBUT Press</p>
                                <p class="border-t border-black pt-1 font-bold">( Admin )</p>
                            </div>
                            <div>
                                <p class="mb-16">Pemesan</p>
                                <p class="border-t border-black pt-1 font-bold">( ${order.customerName} )</p>
                            </div>
                        </div>
                        
                        <div class="mt-8 text-center text-xs italic border-t pt-4">
                            Terima kasih atas kepercayaan Anda memesan buku di YKBUT Press.
                        </div>
                    </div>
                `;

                window.print();
            },

            renderBooks(container) {
                let tableRows = mockBooks.map((book) => `
                    <tr class="border-b hover:bg-gray-50 transition-colors">
                        <td class="py-3 px-4 text-sm font-medium text-gray-800">${book.id}</td>
                        <td class="py-3 px-4">
                            <p class="font-bold text-gray-800 text-sm">${book.title}</p>
                            <p class="text-xs text-gray-500">${book.author} • ${book.pages} Hal</p>
                        </td>
                        <td class="py-3 px-4 text-sm text-gray-600"><span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs font-medium border border-blue-100">${book.category}</span></td>
                        <td class="py-3 px-4 text-sm">
                            <p class="text-xs text-gray-500">HPP: ${formatRupiah(book.costPrice)}</p>
                            <p class="font-bold text-gray-800">Jual: ${formatRupiah(book.defaultPrice)}</p>
                        </td>
                        <td class="py-3 px-4 text-sm font-bold text-green-600">${formatRupiah(book.margin)}</td>
                        <td class="py-3 px-4 text-sm text-center font-bold">${book.stock}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="app.navigate('edit-book', '${book.id}')" class="text-corp-primary hover:bg-blue-50 p-2 rounded-lg transition" title="Edit Buku">
                                <i class="ph ph-pencil-simple text-lg"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

                container.innerHTML = `
                    <div class="fade-in bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                            <h3 class="text-lg font-bold text-gray-800">Manajemen Katalog Buku</h3>
                            <button onclick="app.navigate('add-book')" class="bg-corp-primary text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-800 transition-colors flex items-center shadow-md">
                                <i class="ph ph-plus-circle mr-2 text-lg"></i> Tambah Buku Baru
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-white border-b text-sm text-gray-500 uppercase tracking-wider">
                                        <th class="py-3 px-4 font-semibold">ID</th>
                                        <th class="py-3 px-4 font-semibold">Detail Buku</th>
                                        <th class="py-3 px-4 font-semibold">Kategori</th>
                                        <th class="py-3 px-4 font-semibold">Harga</th>
                                        <th class="py-3 px-4 font-semibold">Margin</th>
                                        <th class="py-3 px-4 font-semibold text-center">Stok</th>
                                        <th class="py-3 px-4 font-semibold text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows.length > 0 ? tableRows : '<tr><td colspan="7" class="text-center py-8 text-gray-500">Belum ada data buku.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            renderBookForm(container, bookId = null) {
                const book = bookId ? mockBooks.find(b => b.id === bookId) : null;
                const isEdit = !!book;
                
                container.innerHTML = `
                    <div class="fade-in max-w-4xl mx-auto">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-2xl font-bold text-gray-800 flex items-center">
                                <i class="ph ${isEdit ? 'ph-pencil-simple' : 'ph-plus-circle'} text-corp-primary mr-3 text-3xl"></i> 
                                ${isEdit ? 'Edit Data Buku' : 'Tambah Buku Baru'}
                            </h3>
                            <button onclick="app.navigate('books')" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition font-medium flex items-center shadow-sm">
                                <i class="ph ph-arrow-left mr-2"></i> Kembali
                            </button>
                        </div>
                        <form id="form-book" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-8 bg-gray-50">
                                <!-- Informasi Dasar -->
                                <div class="space-y-4 bg-white p-5 rounded-lg border border-gray-200">
                                    <h4 class="font-bold text-gray-700 border-b pb-2 mb-4 flex items-center"><i class="ph ph-info mr-2 text-corp-primary text-xl"></i> Informasi Dasar</h4>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Judul Buku *</label>
                                        <input type="text" id="b-title" required value="${book ? book.title : ''}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Penulis *</label>
                                        <input type="text" id="b-author" required value="${book ? book.author : ''}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none">
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-sm font-semibold text-gray-700 mb-1">Kategori</label>
                                            <input type="text" id="b-category" value="${book ? book.category : ''}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-semibold text-gray-700 mb-1">Jml Halaman *</label>
                                            <input type="number" id="b-pages" required value="${book ? book.pages : ''}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Stok Awal *</label>
                                        <input type="number" id="b-stock" required value="${book ? book.stock : '0'}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none">
                                    </div>
                                </div>

                                <!-- Informasi Harga & Stok -->
                                <div class="space-y-4 bg-white p-5 rounded-lg border border-gray-200">
                                    <h4 class="font-bold text-gray-700 border-b pb-2 mb-4 flex items-center"><i class="ph ph-currency-circle-dollar mr-2 text-corp-primary text-xl"></i> Harga & Finansial</h4>
                                    
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">HPP (Harga Pokok Produksi) *</label>
                                        <div class="relative">
                                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 font-medium">Rp</span>
                                            <input type="number" id="b-cost" required value="${book ? book.costPrice : ''}" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Harga Jual *</label>
                                        <div class="relative">
                                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 font-medium">Rp</span>
                                            <input type="number" id="b-price" required value="${book ? book.defaultPrice : ''}" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none">
                                        </div>
                                    </div>
                                    
                                    <div class="mt-6 bg-blue-50 p-4 rounded-lg border border-blue-100 flex justify-between items-center">
                                        <div>
                                            <label class="block text-xs font-bold text-blue-800 uppercase tracking-wider mb-1">Estimasi Margin</label>
                                            <p class="text-xs text-blue-600">(Harga Jual - HPP)</p>
                                        </div>
                                        <div id="b-margin-label" class="text-2xl font-black text-green-600">${book ? formatRupiah(book.margin) : 'Rp 0'}</div>
                                    </div>
                                </div>
                            </div>
                            <div class="p-6 bg-white border-t border-gray-200 flex justify-end">
                                <button type="submit" class="px-8 py-3 bg-corp-primary text-white rounded-lg font-bold hover:bg-blue-800 transition shadow-lg flex items-center">
                                    <i class="ph ph-floppy-disk mr-2 text-xl"></i> ${isEdit ? 'Simpan Perubahan' : 'Simpan Buku Baru'}
                                </button>
                            </div>
                        </form>
                    </div>
                `;

                // Logic kalkulasi margin otomatis
                const costInput = document.getElementById('b-cost');
                const priceInput = document.getElementById('b-price');
                const marginLabel = document.getElementById('b-margin-label');

                const calcMargin = () => {
                    const cost = parseFloat(costInput.value) || 0;
                    const price = parseFloat(priceInput.value) || 0;
                    const margin = price - cost;
                    marginLabel.innerText = formatRupiah(margin);
                    marginLabel.className = margin >= 0 ? "text-2xl font-black text-green-600" : "text-2xl font-black text-red-600";
                };

                costInput.addEventListener('input', calcMargin);
                priceInput.addEventListener('input', calcMargin);

                // Submit form
                document.getElementById('form-book').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const cost = parseFloat(costInput.value) || 0;
                    const price = parseFloat(priceInput.value) || 0;
                    
                    const bookData = {
                        id: bookId || `B${String(mockBooks.length + 1).padStart(3, '0')}`,
                        title: document.getElementById('b-title').value,
                        author: document.getElementById('b-author').value,
                        category: document.getElementById('b-category').value,
                        pages: parseInt(document.getElementById('b-pages').value) || 0,
                        stock: parseInt(document.getElementById('b-stock').value) || 0,
                        costPrice: cost,
                        defaultPrice: price,
                        margin: price - cost
                    };

                    if(isEdit) {
                        const idx = mockBooks.findIndex(b => b.id === bookId);
                        mockBooks[idx] = bookData;
                        alert('Data buku berhasil diperbarui!');
                    } else {
                        mockBooks.push(bookData);
                        alert('Buku baru berhasil ditambahkan ke katalog!');
                    }
                    app.navigate('books');
                });
            },

            // ----------------------------------------------------
            // USER MANAGEMENT FEATURES
            // ----------------------------------------------------
            
            renderUsers(container) {
                let tableRows = mockUsers.map((user) => `
                    <tr class="border-b hover:bg-gray-50 transition-colors">
                        <td class="py-3 px-4 text-sm font-medium text-gray-800">${user.id}</td>
                        <td class="py-3 px-4">
                            <p class="font-bold text-gray-800 text-sm">${user.name}</p>
                            <p class="text-xs text-gray-500">Username: ${user.username}</p>
                        </td>
                        <td class="py-3 px-4 text-sm">
                            ${user.role === 'Administrator' 
                                ? '<span class="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs font-bold border border-purple-200">Administrator</span>' 
                                : '<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold border border-blue-200">Staff Operasional</span>'}
                        </td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="app.openUserModal('${user.id}')" class="text-corp-primary hover:bg-blue-50 p-2 rounded-lg transition" title="Edit User">
                                <i class="ph ph-pencil-simple text-lg"></i>
                            </button>
                            ${user.id !== currentUser.id ? `
                            <button onclick="app.deleteUser('${user.id}')" class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition" title="Hapus User">
                                <i class="ph ph-trash text-lg"></i>
                            </button>` : ''}
                        </td>
                    </tr>
                `).join('');

                container.innerHTML = `
                    <div class="fade-in bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                            <h3 class="text-lg font-bold text-gray-800">Daftar Pengguna Sistem</h3>
                            <button onclick="app.openUserModal()" class="bg-corp-primary text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-800 transition-colors flex items-center shadow-md">
                                <i class="ph ph-user-plus mr-2 text-lg"></i> Tambah User Baru
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-white border-b text-sm text-gray-500 uppercase tracking-wider">
                                        <th class="py-3 px-4 font-semibold">User ID</th>
                                        <th class="py-3 px-4 font-semibold">Nama Lengkap & Username</th>
                                        <th class="py-3 px-4 font-semibold">Otorisasi (Role)</th>
                                        <th class="py-3 px-4 font-semibold text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows.length > 0 ? tableRows : '<tr><td colspan="4" class="text-center py-8 text-gray-500">Belum ada data user.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            openUserModal(userId = null) {
                const user = userId ? mockUsers.find(u => u.id === userId) : null;
                const isEdit = !!user;

                const modalHtml = `
                    <div id="user-modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center fade-in">
                        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
                            <form id="form-user" onsubmit="app.saveUser(event, '${userId || ''}')">
                                <div class="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                                    <h3 class="font-bold text-lg text-gray-800">${isEdit ? 'Edit Data Pengguna' : 'Tambah Pengguna Baru'}</h3>
                                    <button type="button" onclick="app.closeUserModal()" class="text-gray-500 hover:text-red-500 transition"><i class="ph ph-x text-xl"></i></button>
                                </div>
                                <div class="p-6 space-y-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap *</label>
                                        <input type="text" id="m-user-name" required value="${user ? user.name : ''}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Username *</label>
                                        <input type="text" id="m-user-username" required value="${user ? user.username : ''}" ${isEdit ? 'readonly class="w-full px-4 py-2 border border-gray-300 bg-gray-100 rounded-lg outline-none text-gray-500"' : 'class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none"'}>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Password ${isEdit ? '<span class="text-xs text-gray-400 font-normal">(Kosongkan jika tidak diubah)</span>' : '*'}</label>
                                        <input type="password" id="m-user-password" ${isEdit ? '' : 'required'} class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none" placeholder="••••••••">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Otorisasi (Role) *</label>
                                        <select id="m-user-role" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none">
                                            <option value="Staff Operasional" ${user && user.role === 'Staff Operasional' ? 'selected' : ''}>Staff Operasional (Biasa)</option>
                                            <option value="Administrator" ${user && user.role === 'Administrator' ? 'selected' : ''}>Administrator (Penuh)</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="p-4 bg-gray-50 border-t border-gray-200 flex justify-end space-x-3">
                                    <button type="button" onclick="app.closeUserModal()" class="px-4 py-2 text-gray-600 font-medium hover:bg-gray-200 rounded-lg transition">Batal</button>
                                    <button type="submit" class="px-4 py-2 bg-corp-primary text-white font-semibold rounded-lg hover:bg-blue-800 transition shadow">Simpan</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
                document.getElementById('modal-root').innerHTML = modalHtml;
            },

            closeUserModal() {
                document.getElementById('modal-root').innerHTML = '';
            },

            saveUser(e, userId) {
                e.preventDefault();
                const name = document.getElementById('m-user-name').value;
                const username = document.getElementById('m-user-username').value;
                const password = document.getElementById('m-user-password').value;
                const role = document.getElementById('m-user-role').value;

                if (userId) { // Edit
                    const user = mockUsers.find(u => u.id === userId);
                    user.name = name;
                    user.role = role;
                    if(password) user.password = password; // update password jika diisi
                    alert('Data pengguna berhasil diperbarui!');
                } else { // Tambah
                    // Validasi username exist
                    if(mockUsers.some(u => u.username === username)) {
                        alert('Username sudah terdaftar! Gunakan username lain.');
                        return;
                    }
                    const newUser = {
                        id: `U${String(mockUsers.length + 1).padStart(3, '0')}`,
                        username: username,
                        password: password,
                        name: name,
                        role: role
                    };
                    mockUsers.push(newUser);
                    alert('Pengguna baru berhasil ditambahkan!');
                }
                
                this.closeUserModal();
                this.renderUsers(document.getElementById('app-content'));
            },

            deleteUser(userId) {
                if(confirm('Apakah Anda yakin ingin menghapus pengguna ini?')) {
                    mockUsers = mockUsers.filter(u => u.id !== userId);
                    alert('Pengguna berhasil dihapus!');
                    this.renderUsers(document.getElementById('app-content'));
                }
            }
        };

        // Start the application when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

    </script>
</body>
</html>
