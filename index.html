<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Chosen Palette: Warm Corporate Neutral & YKBUT Blue -->
    <!-- Application Structure Plan: Application organized into a single-page dashboard architecture with side navigation dividing operational hubs: Dashboard Analytics, Data Pemesanan (Order Tracking & Filters), Pesanan Baru (Order Creation & Auto-pricing), Katalog Buku (Inventory & Financial Margins), and Manajemen User (RBAC Authorization). Interactive modal dialogues handle granular updates (status, shipping tracking numbers, user accounts) while real-time calculations update metrics instantly. Rationale: Streamlines daily press operations into intuitive sections with minimal context-switching. -->
    <!-- Visualization & Content Choices: Order Status Breakdown -> Comparative Proportion -> Chart.js Doughnut Chart -> Canvas Rendering with maintainAspectRatio: false -> Allows immediate visual assessment of order fulfillment pipeline -> Chart.js Canvas; Key Performance Indicators -> Summary Numbers -> Styled Tailwind CSS Metric Cards -> Visual clarity for sales, revenue, and units sold -> HTML/CSS; Recent Deliveries -> Geospatial activity list -> Styled list with Unicode icons and tracking numbers -> HTML/CSS. CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKBUT Press Order Management System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Konfigurasi Tema Tailwind YKBUT -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'corp-primary': '#1D4ED8', // Biru Utama UT (Blue-700)
                        'corp-dark': '#0F172A',    // Slate-900 Sidebar
                        'corp-light': '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                color: black;
            }
            .print-bg-none { background: none !important; }
        }
        
        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            height: 260px;
            max-height: 320px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden relative">

    <!-- Toast Notification System -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <!-- Login Screen Overlay -->
    <div id="login-screen" class="fixed inset-0 bg-corp-dark z-50 flex items-center justify-center transition-all duration-500">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 relative overflow-hidden fade-in">
            <div class="absolute top-0 left-0 w-full h-2 bg-corp-primary"></div>
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-gray-800 tracking-tight mb-1">YKBUT</h1>
                <span class="text-sm text-corp-primary font-bold tracking-[0.2em] uppercase block">Press System</span>
                <p class="text-gray-500 text-sm mt-4">Silakan masuk menggunakan kredensial Anda</p>
            </div>
            <form id="form-login" onsubmit="app.handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>

                        <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none transition" placeholder="••••••••">

    <!-- Sidebar -->
    <aside class="w-64 bg-corp-dark text-white flex flex-col shadow-2xl z-20 transition-all duration-300">
        <!-- Logo / Title -->
        <div class="h-20 flex items-center justify-center border-b border-gray-800 px-4 pt-2 pb-2">
            <div class="text-center">
                <h1 class="text-white font-black text-2xl tracking-wider leading-none">YKBUT</h1>
                <span class="text-xs text-corp-primary font-bold tracking-[0.2em] uppercase mt-1 block">Press System</span>

        <!-- Navigation Links -->
        <nav class="flex-1 px-4 py-6 space-y-2">
            <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="w-full flex items-center px-4 py-3 bg-corp-primary text-white rounded-lg font-semibold transition-colors">

            <button onclick="app.navigate('orders')" id="nav-orders" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors">

            <button onclick="app.navigate('add-order')" id="nav-add-order" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors">

            <button onclick="app.navigate('books')" id="nav-books" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors">

            <button onclick="app.navigate('users')" id="nav-users" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors hidden">

        <!-- User Profile & Logout -->
        <div class="p-4 border-t border-gray-800 flex justify-between items-center">
            <div class="flex items-center text-sm text-gray-400">
                <i class="ph ph-user-circle text-2xl mr-2 text-corp-primary"></i>
                <div>
                    <p class="font-semibold text-white" id="sidebar-user-name">Admin YKBUT</p>
                    <p class="text-xs" id="sidebar-user-role">Administrator</p>
                </div>
            </div>
            <button onclick="app.logout()" class="text-gray-400 hover:text-red-500 transition" title="Logout">

            </button>

    <!-- Main Content wrapper -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <!-- Top Header -->
        <header class="h-20 bg-white border-b-4 border-corp-primary shadow-sm flex items-center justify-between px-8 z-10">
            <div class="flex items-center space-x-4">
                <h2 class="text-xl font-bold text-gray-800" id="page-title">Dashboard Analitik</h2>
                <!-- Sync Badge -->
                <div id="sync-status-badge" class="flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">
                    <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                    <span id="sync-status-text">Google Sheets Sync</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <button onclick="app.syncFromSpreadsheet()" title="Sinkronkan ulang dengan Google Spreadsheet" class="px-3 py-1.5 text-xs font-semibold bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg flex items-center transition border border-gray-300">
                    <i class="ph ph-arrows-clockwise text-sm mr-1.5" id="sync-icon"></i> Reload Data
                </button>
                <span class="text-sm text-gray-500 flex items-center">
                    <i class="ph ph-calendar-blank mr-2 text-lg"></i>
                    <span id="current-date"></span>
                </span>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-8" id="app-content">
            <!-- Content dynamic render via JS -->
        </main>
    </div>

    <!-- Modal Root untuk Popups -->
    <div id="modal-root"></div>

    <!-- Print Area -->
    <div id="print-area" class="hidden p-8 font-sans">
        <!-- Receipt template render JS -->
    </div>

    <!-- Javascript Application Logic -->
    <script>
        // Konfigurasi Endpoint Google Sheets & Apps Script
        const SPREADSHEET_CONFIG = {
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycbxSa2noM-2tno2S3X7jNqJ2JOmaDzagRvukG-IIS8buG2_4B4dmht_YBevwDZ9sgWgc/exec",
            SPREADSHEET_ID: "115m5DYcwSiH6cEOkIBWgdsBG_59a6SPHyWj4V0EZqp8"
        };

        // Standalone / Fallback Data
        let mockUsers = [
            { id: 'U001', username: 'admin', password: '123', role: 'Administrator', name: 'Admin Utama' },
            { id: 'U002', username: 'staff', password: '123', role: 'Staff Operasional', name: 'Petugas Kasir' }
        ];

        let mockBooks = [
            { id: 'B001', title: 'Manajemen Alat Berat Terpadu', author: 'Ir. Budi Santoso', pages: 320, category: 'Manajemen', costPrice: 100000, defaultPrice: 150000, margin: 50000, stock: 100 },
            { id: 'B002', title: 'Dasar-dasar Hidrolik', author: 'Ahmad Teknik, MT', pages: 250, category: 'Teknik', costPrice: 85000, defaultPrice: 125000, margin: 40000, stock: 85 },
            { id: 'B003', title: 'Keselamatan Kerja Pertambangan', author: 'Dr. Safety First', pages: 180, category: 'K3', costPrice: 60000, defaultPrice: 90000, margin: 30000, stock: 200 },
            { id: 'B004', title: 'Leadership di Lapangan', author: 'HR YKBUT', pages: 210, category: 'Manajemen', costPrice: 75000, defaultPrice: 110000, margin: 35000, stock: 50 },
            { id: 'B005', title: 'Panduan Maintenance Engine Diesel', author: 'Tim Mekanik Ahli', pages: 400, category: 'Teknik', costPrice: 120000, defaultPrice: 175000, margin: 55000, stock: 40 }
        ];

        const ORDER_STATUS = { NEW: 'Pesanan Baru', PROCESSED: 'Diproses', SHIPPING: 'Pengiriman', COMPLETED: 'Selesai' };
        const PAYMENT_STATUS = { UNPAID: 'Belum Bayar', DP: 'DP / Sebagian', PAID: 'Lunas' };

        let appData = {
            orders: [
                { id: 'ORD-001', date: '2026-09-10', customerName: 'PT. Andalan Maju', customerPhone: '08123456789', customerEmail: 'info@andalan.co.id', customerAddress: 'Jl. Sudirman No 1, Jakarta Pusat', bookId: 'B001', qty: 10, unitPrice: 150000, totalPrice: 1500000, status: ORDER_STATUS.COMPLETED, paymentStatus: PAYMENT_STATUS.PAID, dpAmount: 1500000, shippingVendor: 'JNE', trackingNumber: 'JNE1234567890' },
                { id: 'ORD-002', date: '2026-09-11', customerName: 'Budi Santoso', customerPhone: '08987654321', customerEmail: 'budi.s@gmail.com', customerAddress: 'Komp. Harapan Jaya, Bekasi', bookId: 'B003', qty: 2, unitPrice: 90000, totalPrice: 180000, status: ORDER_STATUS.NEW, paymentStatus: PAYMENT_STATUS.UNPAID, dpAmount: 0, shippingVendor: '', trackingNumber: '' },
                { id: 'ORD-003', date: '2026-09-11', customerName: 'CV. Bangun Konstruksi', customerPhone: '08112233445', customerEmail: 'procurement@bangun.com', customerAddress: 'Kawasan Industri Cikarang Blok C2', bookId: 'B005', qty: 5, unitPrice: 170000, totalPrice: 850000, status: ORDER_STATUS.PROCESSED, paymentStatus: PAYMENT_STATUS.DP, dpAmount: 400000, shippingVendor: '', trackingNumber: '' },
            ]
        };

        let currentUser = null;
        let statusChartInstance = null;
        let orderSearchQuery = '';
        let bookSearchQuery = '';

        // Utilities
        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number || 0);
        const getBook = (id) => mockBooks.find(b => b.id === id);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-lg shadow-xl text-sm font-medium flex items-center space-x-2 fade-in pointer-events-auto`;
            toast.innerHTML = `<i class="ph ${type === 'success' ? 'ph-check-circle' : type === 'error' ? 'ph-x-circle' : 'ph-info'} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // API Service Wrapper (Google Apps Script / HTTP Fetch)
        const apiService = {
            async fetchAll() {
                try {
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        return new Promise((resolve, reject) => {
                            google.script.run
                                .withSuccessHandler((data) => resolve(data))
                                .withFailureHandler((err) => reject(err))
                                .getAllData();
                        });
                    }

                    const response = await fetch(`${SPREADSHEET_CONFIG.WEB_APP_URL}?action=getAllData`, {
                        method: 'GET',
                        redirect: 'follow'
                    });

                    if (!response.ok) throw new Error('Network error');
                    return await response.json();
                } catch (error) {
                    console.warn('Sync server warning, fallback to cached state:', error);
                    return null;
                }
            },

            async sendAction(action, payload) {
                try {
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        return new Promise((resolve, reject) => {
                            google.script.run
                                .withSuccessHandler((res) => resolve(res))
                                .withFailureHandler((err) => reject(err))
                                .executeAction(action, payload);
                        });
                    }

                    const response = await fetch(SPREADSHEET_CONFIG.WEB_APP_URL, {
                        method: 'POST',
                        mode: 'cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action, data: payload })
                    });
                    
                    const text = await response.text();
                    try { return JSON.parse(text); } catch (e) { return { status: 'success', raw: text }; }
                } catch (error) {
                    console.warn(`Action ${action} result:`, error);
                    return { status: 'offline', message: 'Tersimpan secara lokal' };
                }
            }
        };

        // Core Application Logic
        const app = {
            currentView: 'dashboard',
            
            init() {
                this.loadLocalStorage();
                this.checkAuth();
                this.syncFromSpreadsheet();
            },

            loadLocalStorage() {
                try {
                    const savedOrders = localStorage.getItem('ykbut_orders');
                    const savedBooks = localStorage.getItem('ykbut_books');
                    const savedUsers = localStorage.getItem('ykbut_users');

                    if (savedOrders) appData.orders = JSON.parse(savedOrders);
                    if (savedBooks) mockBooks = JSON.parse(savedBooks);
                    if (savedUsers) mockUsers = JSON.parse(savedUsers);
                } catch(e) { console.error('LocalStorage error', e); }
            },

            saveLocalStorage() {
                try {
                    localStorage.setItem('ykbut_orders', JSON.stringify(appData.orders));
                    localStorage.setItem('ykbut_books', JSON.stringify(mockBooks));
                    localStorage.setItem('ykbut_users', JSON.stringify(mockUsers));
                } catch(e) { console.error('LocalStorage save error', e); }
            },

            async syncFromSpreadsheet() {
                const badgeText = document.getElementById('sync-status-text');
                const badge = document.getElementById('sync-status-badge');
                const syncIcon = document.getElementById('sync-icon');

                if(syncIcon) syncIcon.classList.add('animate-spin');
                if(badgeText) badgeText.innerText = "Menghubungkan...";

                const serverData = await apiService.fetchAll();

                if(syncIcon) syncIcon.classList.remove('animate-spin');

                if (serverData && serverData.status === 'success') {
                    if (serverData.orders && serverData.orders.length > 0) appData.orders = serverData.orders;
                    if (serverData.books && serverData.books.length > 0) mockBooks = serverData.books;
                    if (serverData.users && serverData.users.length > 0) mockUsers = serverData.users;

                    this.saveLocalStorage();

                    if(badge) {
                        badge.className = "flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-green-50 text-green-700 border border-green-200";
                        badgeText.innerText = "Google Sheets Connected";
                    }
                    showToast('Data berhasil disinkronkan dari Google Sheets', 'success');
                    this.navigate(this.currentView);
                } else {
                    if(badge) {
                        badge.className = "flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200";
                        badgeText.innerText = "Mode Standalone / Cached";
                    }
                }
            },

            checkAuth() {
                const loginScreen = document.getElementById('login-screen');
                if(!currentUser) {
                    loginScreen.classList.remove('hidden');
                    loginScreen.classList.add('flex');
                } else {
                    loginScreen.classList.add('hidden');
                    loginScreen.classList.remove('flex');
                    
                    document.getElementById('sidebar-user-name').innerText = currentUser.name;
                    document.getElementById('sidebar-user-role').innerText = currentUser.role;

                    const navUsersBtn = document.getElementById('nav-users');
                    if (currentUser.role === 'Administrator') {
                        navUsersBtn.classList.remove('hidden');
                    } else {
                        navUsersBtn.classList.add('hidden');
                    }

                    this.updateDate();
                    this.navigate('dashboard');
                }
            },

            handleLogin(e) {
                e.preventDefault();
                const userVal = document.getElementById('login-username').value;
                const passVal = document.getElementById('login-password').value;
                const errorMsg = document.getElementById('login-error');

                const foundUser = mockUsers.find(u => u.username.toLowerCase() === userVal.toLowerCase() && u.password === passVal);

                if (foundUser) {
                    currentUser = foundUser;
                    errorMsg.classList.add('hidden');
                    document.getElementById('form-login').reset();
                    showToast(`Selamat datang, ${currentUser.name}!`, 'success');
                    this.checkAuth();
                } else {
                    errorMsg.classList.remove('hidden');
                }
            },

            logout() {
                currentUser = null;
                showToast('Anda telah keluar dari sistem.');
                this.checkAuth();
            },

            updateDate() {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', options);
            },

            navigate(view, param = null) {
                this.currentView = (view === 'add-book' || view === 'edit-book') ? 'books' : view;
                this.updateNavStyle();
                
                const contentDiv = document.getElementById('app-content');
                const titleElement = document.getElementById('page-title');
                
                contentDiv.innerHTML = '';
                
                if(statusChartInstance) {
                    statusChartInstance.destroy();
                    statusChartInstance = null;
                }

                switch(view) {
                    case 'dashboard':
                        titleElement.innerText = "Dashboard Analitik";
                        this.renderDashboard(contentDiv);
                        break;
                    case 'orders':
                        titleElement.innerText = "Data Pemesanan Buku";
                        this.renderOrders(contentDiv);
                        break;
                    case 'add-order':
                        titleElement.innerText = "Input Pesanan Baru";
                        this.renderAddOrder(contentDiv);
                        break;
                    case 'books':
                        titleElement.innerText = "Manajemen Katalog Buku";
                        this.renderBooks(contentDiv);
                        break;
                    case 'add-book':
                        titleElement.innerText = "Tambah Buku Baru";
                        this.renderBookForm(contentDiv);
                        break;
                    case 'edit-book':
                        titleElement.innerText = "Edit Data Buku";
                        this.renderBookForm(contentDiv, param);
                        break;
                    case 'users':
                        if(currentUser && currentUser.role === 'Administrator') {
                            titleElement.innerText = "Manajemen Pengguna Sistem";
                            this.renderUsers(contentDiv);
                        } else {
                            titleElement.innerText = "Akses Ditolak";
                            contentDiv.innerHTML = `<div class="text-center py-20"><i class="ph ph-lock-key text-6xl text-red-500 mb-4"></i><h2 class="text-2xl font-bold text-gray-800">Akses Ditolak</h2><p class="text-gray-500">Anda tidak memiliki otorisasi untuk halaman ini.</p></div>`;
                        }
                        break;
                }
            },

            updateNavStyle() {
                const navs = ['dashboard', 'orders', 'add-order', 'books', 'users'];
                navs.forEach(nav => {
                    const btn = document.getElementById(`nav-${nav}`);
                    if(!btn) return;
                    if (nav === this.currentView) {
                        btn.className = "w-full flex items-center px-4 py-3 bg-corp-primary text-white rounded-lg font-semibold shadow-md transition-colors";
                    } else {
                        btn.className = "w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors";
                    }
                });
            },

            renderDashboard(container) {
                const totalOrdersCount = appData.orders.length;
                const totalBooksSold = appData.orders.reduce((sum, order) => sum + Number(order.qty || 0), 0);
                const totalRevenue = appData.orders.reduce((sum, order) => sum + Number(order.totalPrice || 0), 0);

                const countNew = appData.orders.filter(o => o.status === ORDER_STATUS.NEW).length;
                const countProcessed = appData.orders.filter(o => o.status === ORDER_STATUS.PROCESSED).length;
                const countShipping = appData.orders.filter(o => o.status === ORDER_STATUS.SHIPPING).length;
                const countCompleted = appData.orders.filter(o => o.status === ORDER_STATUS.COMPLETED).length;

                container.innerHTML = `
                    <div class="fade-in space-y-6">
                        <!-- Brief Description -->
                        <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 text-sm text-blue-900 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <i class="ph ph-chart-line-up text-2xl text-corp-primary"></i>
                                <span>Ringkasan performa penjualan dan status distribusi pemesanan buku YKBUT Press secara real-time.</span>
                            </div>
                        </div>

                        <!-- Stats Row -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-white rounded-xl shadow-sm border-l-4 border-blue-500 p-6 flex items-center justify-between">
                                <div>
                                    <p class="text-xs text-gray-500 mb-1 font-bold uppercase tracking-wider">Total Transaksi</p>
                                    <h3 class="text-3xl font-bold text-gray-800">${totalOrdersCount}</h3>
                                </div>

            exportToExcel() {
                let tableHtml = `
                    <table border="1">
                        <tr>
                            <th>ID Transaksi</th>
                            <th>Tanggal</th>
                            <th>Nama Pemesan</th>
                            <th>No HP</th>
                            <th>Email</th>

                            <th>Judul Buku</th>
                            <th>Qty</th>
                            <th>Harga Satuan</th>
                            <th>Total Harga</th>
                            <th>Status Transaksi</th>
                            <th>Status Pembayaran</th>
                            <th>DP Amount</th>
                            <th>Vendor Ekspedisi</th>
                            <th>Nomor Resi</th>
                        </tr>
                `;
                
                appData.orders.forEach(order => {
                    const book = getBook(order.bookId);
                    tableHtml += `
                        <tr>
                            <td>${order.id}</td>
                            <td>${order.date}</td>
                            <td>${order.customerName}</td>
                            <td>${order.customerPhone}</td>
                            <td>${order.customerEmail || '-'}</td>
                            <td>${order.customerAddress}</td>
                            <td>${book ? book.title : '-'}</td>
                            <td>${order.qty}</td>
                            <td>${order.unitPrice}</td>
                            <td>${order.totalPrice}</td>
                            <td>${order.status}</td>
                            <td>${order.paymentStatus}</td>
                            <td>${order.dpAmount}</td>
                            <td>${order.shippingVendor || '-'}</td>
                            <td>${order.trackingNumber || '-'}</td>
                        </tr>
                    `;
                });
                tableHtml += `</table>`;
                
                const uri = 'data:application/vnd.ms-excel;base64,';
                const template = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Data Pesanan</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>{table}</body></html>';
                const base64 = function(s) { return window.btoa(unescape(encodeURIComponent(s))) };
                const format = function(s, c) { return s.replace(/{(\w+)}/g, function(m, p) { return c[p]; }) };
                
                const ctx = { worksheet: 'Worksheet', table: tableHtml };
                const link = document.createElement("a");
                link.download = `Data_Pesanan_YKBUT_${new Date().toISOString().slice(0,10)}.xls`;
                link.href = uri + base64(format(template, ctx));
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('Export data ke Excel berhasil!');
            },

                const container = document.getElementById('modal-shipping-container');
                if(statusValue === ORDER_STATUS.SHIPPING || statusValue === ORDER_STATUS.COMPLETED) {
                    container.classList.remove('hidden');
                    container.classList.add('block');

                    container.classList.remove('block');

            async saveOrderEdit(orderId) {
                const order = appData.orders.find(o => o.id === orderId);
                if(!order) return;

                const newPayStatus = document.getElementById('modal-pay-status').value;
                const newOrderStatus = document.getElementById('modal-order-status').value;
                const vendor = document.getElementById('modal-vendor').value;
                const resi = document.getElementById('modal-resi').value;

                order.paymentStatus = newPayStatus;
                order.status = newOrderStatus;
                
                if (newOrderStatus === ORDER_STATUS.SHIPPING || newOrderStatus === ORDER_STATUS.COMPLETED) {
                    order.shippingVendor = vendor;
                    order.trackingNumber = resi;

                if (newPayStatus === PAYMENT_STATUS.PAID) {
                    order.dpAmount = order.totalPrice;

                this.saveLocalStorage();
                this.closeEditOrderModal();
                this.renderOrders(document.getElementById('app-content'));

                showToast('Mengirim update ke Google Sheets...', 'info');

                const form = document.getElementById('form-add-order');
                const selectBook = document.getElementById('book-select');
                const inputPrice = document.getElementById('book-price');
                const inputQty = document.getElementById('book-qty');
                const labelTotal = document.getElementById('label-total-price');
                const selectPay = document.getElementById('pay-status');
                const containerDp = document.getElementById('dp-input-container');
                const inputDp = document.getElementById('pay-dp');

                const calculateTotal = () => {
                    const price = parseFloat(inputPrice.value) || 0;
                    const qty = parseInt(inputQty.value) || 0;
                    const total = price * qty;
                    labelTotal.innerText = formatRupiah(total);
                };

                selectBook.addEventListener('change', (e) => {
                    const selectedOption = e.target.options[e.target.selectedIndex];
                    if(selectedOption.value !== "") {
                        inputPrice.value = selectedOption.getAttribute('data-price');
                        calculateTotal();
                    } else {
                        inputPrice.value = "";
                        labelTotal.innerText = "Rp 0";
                    }
                });

                inputPrice.addEventListener('input', calculateTotal);
                inputQty.addEventListener('input', calculateTotal);

                selectPay.addEventListener('change', (e) => {
                    if(e.target.value === PAYMENT_STATUS.DP) {
                        containerDp.classList.remove('hidden');
                        inputDp.setAttribute('required', 'true');
                    } else {
                        containerDp.classList.add('hidden');
                        inputDp.removeAttribute('required');
                        inputDp.value = "";
                    }
                });

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const price = parseFloat(inputPrice.value);
                    const qty = parseInt(inputQty.value);
                    const total = price * qty;
                    const pStatus = selectPay.value;
                    let dp = 0;
                    
                    if(pStatus === PAYMENT_STATUS.DP) dp = parseFloat(inputDp.value) || 0;
                    else if(pStatus === PAYMENT_STATUS.PAID) dp = total;

                    const newOrder = {
                        id: `ORD-${String(appData.orders.length + 1).padStart(3, '0')}`,
                        date: new Date().toISOString().split('T')[0],
                        customerName: document.getElementById('cust-name').value,
                        customerPhone: document.getElementById('cust-phone').value,
                        customerEmail: document.getElementById('cust-email').value,
                        customerAddress: document.getElementById('cust-address').value,
                        bookId: selectBook.value,
                        qty: qty,
                        unitPrice: price,
                        totalPrice: total,
                        status: ORDER_STATUS.NEW,
                        paymentStatus: pStatus,
                        dpAmount: dp,
                        shippingVendor: '',
                        trackingNumber: ''
                    };

                    appData.orders.unshift(newOrder);
                    this.saveLocalStorage();
                    showToast('Pesanan dibuat! Menyimpan ke Google Sheets...', 'info');
                    
                    app.navigate('orders');
                    
                    await apiService.sendAction('saveOrder', newOrder);
                    showToast('Pesanan tersimpan di Google Sheets!', 'success');
                });
            },

                                    <h3 class="font-bold text-lg text-gray-800">${isEdit ? 'Edit Data Pengguna' : 'Tambah Pengguna Baru'}</h3>
                                    <button type="button" onclick="app.closeUserModal()" class="text-gray-500 hover:text-red-500 transition"><i class="ph ph-x text-xl"></i></button>
                                </div>
                                <div class="p-6 space-y-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap *</label>
                                        <input type="text" id="m-user-name" required value="${user ? user.name : ''}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Username *</label>
                                        <input type="text" id="m-user-username" required value="${user ? user.username : ''}" ${isEdit ? 'readonly class="w-full px-4 py-2 border border-gray-300 bg-gray-100 rounded-lg outline-none text-gray-500"' : 'class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none"'}>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Password ${isEdit ? '<span class="text-xs text-gray-400 font-normal">(Kosongkan jika tidak diubah)</span>' : '*'}</label>
                                        <input type="password" id="m-user-password" ${isEdit ? '' : 'required'} class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none" placeholder="••••••••">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Otorisasi (Role) *</label>
                                        <select id="m-user-role" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none">
                                            <option value="Staff Operasional" ${user && user.role === 'Staff Operasional' ? 'selected' : ''}>Staff Operasional</option>
                                            <option value="Administrator" ${user && user.role === 'Administrator' ? 'selected' : ''}>Administrator</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="p-4 bg-gray-50 border-t border-gray-200 flex justify-end space-x-3">
                                    <button type="button" onclick="app.closeUserModal()" class="px-4 py-2 text-gray-600 font-medium hover:bg-gray-200 rounded-lg transition">Batal</button>
                                    <button type="submit" class="px-4 py-2 bg-corp-primary text-white font-semibold rounded-lg hover:bg-blue-800 transition shadow">Simpan</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
                document.getElementById('modal-root').innerHTML = modalHtml;
            },

            closeUserModal() {
                document.getElementById('modal-root').innerHTML = '';
            },

            async saveUser(e, userId) {
                e.preventDefault();
                const name = document.getElementById('m-user-name').value;
                const username = document.getElementById('m-user-username').value;
                const password = document.getElementById('m-user-password').value;
                const role = document.getElementById('m-user-role').value;

                let targetUser = null;

                if (userId) {
                    targetUser = mockUsers.find(u => u.id === userId);
                    targetUser.name = name;
                    targetUser.role = role;
                    if(password) targetUser.password = password;
                } else {
                    if(mockUsers.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                        showToast('Username sudah terdaftar!', 'error');
                        return;
                    }
                    targetUser = {
                        id: `U${String(mockUsers.length + 1).padStart(3, '0')}`,
                        username: username,
                        password: password,
                        name: name,
                        role: role
                    };
                    mockUsers.push(targetUser);
                }
                
                this.saveLocalStorage();
                this.closeUserModal();
                this.renderUsers(document.getElementById('app-content'));

                showToast('Menyimpan perubahan ke Google Sheets...', 'info');
                await apiService.sendAction('saveUser', targetUser);
                showToast('Data pengguna berhasil diperbarui!', 'success');
            },

            async deleteUser(userId) {
                if(confirm('Apakah Anda yakin ingin menghapus pengguna ini?')) {
                    mockUsers = mockUsers.filter(u => u.id !== userId);
                    this.saveLocalStorage();
                    this.renderUsers(document.getElementById('app-content'));
                    
                    showToast('Menghapus dari Google Sheets...', 'info');
                    await apiService.sendAction('deleteUser', { id: userId });
                    showToast('Pengguna berhasil dihapus!', 'success');
                }
            }
        };

        // Initialize App on DOM Ready
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
