<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKBUT Press Order Management System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'corp-primary': '#1D4ED8',
                        'corp-dark': '#0F172A',
                        'corp-light': '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        @media print {
            @page { margin: 0; }
            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm !important; /* Ukuran Thermal Printer */
                padding: 4mm !important;
                background: white;
                color: black;
                margin: 0;
            }
            .print-bg-none { background: none !important; }
        }
        
        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            height: 260px;
            max-height: 320px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden relative">

    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <div id="login-screen" class="fixed inset-0 bg-corp-dark z-50 flex items-center justify-center transition-all duration-500">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 relative overflow-hidden fade-in">
            <div class="absolute top-0 left-0 w-full h-2 bg-corp-primary"></div>
            <div class="text-center mb-8">
                <!-- TEMPAT LOGO UNTUK HALAMAN LOGIN -->
                <!-- Nanti ganti atribut src di bawah dengan URL logo dari Github Anda -->
                <div class="flex justify-center mb-4">
                    <img src="logo YKBUT Press_2.jpeg" alt="Logo YKBUT" class="h-16 w-auto object-contain">
                </div>
                <h1 class="text-3xl font-black text-gray-800 tracking-tight mb-1">YKBUT</h1>
                <span class="text-sm text-corp-primary font-bold tracking-[0.2em] uppercase block">Press System</span>
                <p class="text-gray-500 text-sm mt-4">Silakan masuk menggunakan kredensial Anda</p>
            </div>
            <form id="form-login" onsubmit="app.handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                    <div class="relative">
                        <i class="ph ph-user absolute left-3 top-2.5 text-gray-400 text-xl"></i>
                        <input type="text" id="login-username" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none transition" placeholder="admin">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <i class="ph ph-lock absolute left-3 top-2.5 text-gray-400 text-xl"></i>
                        <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none transition" placeholder="••••••••">
                    </div>
                </div>
                <div id="login-error" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100 flex items-center">
                    <i class="ph ph-warning-circle mr-2 text-lg"></i> Username atau Password salah!
                </div>
                <button type="submit" id="btn-login-submit" class="w-full bg-corp-primary text-white font-bold py-2.5 rounded-lg hover:bg-blue-800 transition shadow-lg mt-4 flex justify-center items-center">

            </form>
        </div>
    </div>

    <aside class="w-64 bg-corp-dark text-white flex flex-col shadow-2xl z-20 transition-all duration-300">
        <div class="py-5 flex flex-col items-center justify-center border-b border-gray-800 px-4">
            <!-- TEMPAT LOGO UNTUK SIDEBAR MENU -->
            <!-- Nanti ganti atribut src di bawah dengan URL logo dari Github Anda -->
            <img src="logo YKBUT Press_2.jpeg" alt="Logo Sidebar" class="h-12 w-auto mb-3 object-contain rounded">
            <div class="text-center">
                <h1 class="text-white font-black text-2xl tracking-wider leading-none">YKBUT</h1>
                <span class="text-xs text-corp-primary font-bold tracking-[0.2em] uppercase mt-1 block">Press System</span>
            </div>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2">
            <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="w-full flex items-center px-4 py-3 bg-corp-primary text-white rounded-lg font-semibold transition-colors">
                <i class="ph ph-squares-four text-xl mr-3"></i> Dashboard
            </button>
            <button onclick="app.navigate('orders')" id="nav-orders" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors">

            <button onclick="app.navigate('add-order')" id="nav-add-order" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors">
                <i class="ph ph-plus-circle text-xl mr-3"></i> Pesanan Baru
            </button>
            <button onclick="app.navigate('books')" id="nav-books" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors">

            </button>
            <button onclick="app.navigate('users')" id="nav-users" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors hidden">
                <i class="ph ph-users text-xl mr-3"></i> Manajemen User

        <div class="p-4 border-t border-gray-800 flex justify-between items-center">

                <i class="ph ph-user-circle text-2xl mr-2 text-corp-primary"></i>
                <div>
                    <p class="font-semibold text-white" id="sidebar-user-name">Admin YKBUT</p>
                    <p class="text-xs" id="sidebar-user-role">Administrator</p>
                </div>
            </div>
            <button onclick="app.logout()" class="text-gray-400 hover:text-red-500 transition" title="Logout">
                <i class="ph ph-sign-out text-xl"></i>
            </button>

    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-20 bg-white border-b-4 border-corp-primary shadow-sm flex items-center justify-between px-8 z-10">
            <div class="flex items-center space-x-4">
                <h2 class="text-xl font-bold text-gray-800 cursor-pointer hover:text-corp-primary transition" id="page-title" onclick="app.openSheetConfigModal()" title="Klik untuk Pengaturan Koneksi">Dashboard Analitik</h2>
                <button onclick="app.openSheetConfigModal()" title="Klik untuk Diagnosa & Pengaturan Koneksi Spreadsheet" class="cursor-pointer">
                    <div id="sync-status-badge" class="flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 transition">
                        <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                        <span id="sync-status-text">Mengecek Koneksi Sheets...</span>
                        <i class="ph ph-gear text-sm ml-1"></i>
                    </div>
                </button>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="app.openSheetConfigModal()" class="px-3 py-1.5 text-xs font-semibold bg-blue-50 hover:bg-blue-100 text-corp-primary rounded-lg flex items-center transition border border-blue-200">
                    <i class="ph ph-wrench text-base mr-1.5"></i> Setup &amp; Diagnosa Sheets
                </button>
                <button onclick="app.syncFromSpreadsheet()" title="Sinkronkan ulang dengan Google Spreadsheet" class="px-3 py-1.5 text-xs font-semibold bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg flex items-center transition border border-gray-300">
                    <i class="ph ph-arrows-clockwise text-sm mr-1.5" id="sync-icon"></i> Reload Data
                </button>
                <span class="text-sm text-gray-500 flex items-center border-l pl-3 ml-1">
                    <i class="ph ph-calendar-blank mr-1.5 text-lg"></i>
                    <span id="current-date"></span>
                </span>
            </div>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-8" id="app-content">
        </main>
    </div>

    <!-- Modal Root and Print Area -->
    <div id="modal-root"></div>
    <div id="print-area" class="hidden font-sans"></div>

    <script>
        const SPREADSHEET_CONFIG = {
            TARGET_SHEET_ID: "115m5DYcwSiH6cEOkIBWgdsBG_59a6SPHyWj4V0EZqp8",
            DEFAULT_WEB_APP_URL: "https://script.google.com/macros/s/AKfycbxUz8zf_ZQa23U48EaGLNh9p1b1tVwNp4nmoaTNaBbri50PrYCOwdkBUI0d_UQ8o1Ke/exec"
        };

        function getWebAppUrl() {
            return (localStorage.getItem('ykbut_webapp_url') || SPREADSHEET_CONFIG.DEFAULT_WEB_APP_URL).trim();
        }

        let mockUsers = [
            { id: 'U001', username: 'admin', password: '12345', role: 'Administrator', name: 'Admin Utama' },
            { id: 'U002', username: 'staff', password: '123', role: 'Staff Operasional', name: 'Petugas Kasir' }
        ];

        let mockBooks = [
            { id: 'B001', title: 'Manajemen Alat Berat Terpadu', author: 'Ir. Budi Santoso', pages: 320, category: 'Manajemen', costPrice: 100000, defaultPrice: 150000, margin: 50000, stock: 100 },
            { id: 'B002', title: 'Dasar-dasar Hidrolik', author: 'Ahmad Teknik, MT', pages: 250, category: 'Teknik', costPrice: 85000, defaultPrice: 125000, margin: 40000, stock: 85 },
            { id: 'B003', title: 'Keselamatan Kerja Pertambangan', author: 'Dr. Safety First', pages: 180, category: 'K3', costPrice: 60000, defaultPrice: 90000, margin: 30000, stock: 200 },
            { id: 'B004', title: 'Leadership di Lapangan', author: 'HR YKBUT', pages: 210, category: 'Manajemen', costPrice: 75000, defaultPrice: 110000, margin: 35000, stock: 50 },
            { id: 'B005', title: 'Panduan Maintenance Engine Diesel', author: 'Tim Mekanik Ahli', pages: 400, category: 'Teknik', costPrice: 120000, defaultPrice: 175000, margin: 55000, stock: 40 }
        ];

        const ORDER_STATUS = { NEW: 'Pesanan Baru', PROCESSED: 'Diproses', SHIPPING: 'Pengiriman', COMPLETED: 'Selesai' };
        const PAYMENT_STATUS = { UNPAID: 'Belum Bayar', DP: 'DP / Sebagian', PAID: 'Lunas' };

        let appData = {
            orders: [
                { id: 'ORD-001', date: '2026-09-10', customerName: 'PT. Andalan Maju', customerPhone: '08123456789', customerEmail: 'info@andalan.co.id', customerAddress: 'Jl. Sudirman No 1, Jakarta Pusat', bookId: 'B001', qty: 10, unitPrice: 150000, shippingCost: 50000, totalPrice: 1550000, status: ORDER_STATUS.COMPLETED, paymentStatus: PAYMENT_STATUS.PAID, dpAmount: 1550000, shippingVendor: 'JNE', trackingNumber: 'JNE1234567890' },
                { id: 'ORD-002', date: '2026-09-11', customerName: 'Budi Santoso', customerPhone: '08987654321', customerEmail: 'budi.s@gmail.com', customerAddress: 'Komp. Harapan Jaya, Bekasi', bookId: 'B003', qty: 2, unitPrice: 90000, shippingCost: 0, totalPrice: 180000, status: ORDER_STATUS.NEW, paymentStatus: PAYMENT_STATUS.UNPAID, dpAmount: 0, shippingVendor: '', trackingNumber: '' },
                { id: 'ORD-003', date: '2026-09-11', customerName: 'CV. Bangun Konstruksi', customerPhone: '08112233445', customerEmail: 'procurement@bangun.com', customerAddress: 'Kawasan Industri Cikarang Blok C2', bookId: 'B005', qty: 5, unitPrice: 170000, shippingCost: 20000, totalPrice: 870000, status: ORDER_STATUS.PROCESSED, paymentStatus: PAYMENT_STATUS.DP, dpAmount: 400000, shippingVendor: '', trackingNumber: '' },
            ]
        };

        let currentUser = null;
        let statusChartInstance = null;
        let orderSearchQuery = '';
        let bookSearchQuery = '';
        let selectedBookIds = [];

        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number || 0);
        const getBook = (id) => mockBooks.find(b => b.id === id);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-lg shadow-xl text-sm font-medium flex items-center space-x-2 fade-in pointer-events-auto`;
            toast.innerHTML = `<i class="ph ${type === 'success' ? 'ph-check-circle' : type === 'error' ? 'ph-x-circle' : 'ph-info'} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const apiService = {
            async fetchAll() {
                try {
                    const targetUrl = getWebAppUrl();
                    if(!targetUrl || !targetUrl.startsWith('http')) {
                        return { status: 'unconfigured', message: 'Web App URL belum dikonfigurasi.' };
                    }

                    const fetchUrl = targetUrl.includes('?') 
                        ? `${targetUrl}&action=getAllData&_t=${Date.now()}`
                        : `${targetUrl}?action=getAllData&_t=${Date.now()}`;

                    const response = await fetch(fetchUrl, { method: 'GET', redirect: 'follow' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}: Respons server tidak valid`);
                    return await response.json();
                } catch (error) {
                    console.warn('Sync warning:', error);
                    return { status: 'error', message: error.message || 'Gagal terhubung ke Google Sheets' };
                }
            },

            async sendAction(action, payload) {
                try {
                    const targetUrl = getWebAppUrl();
                    if(!targetUrl || !targetUrl.startsWith('http')) {
                        return { status: 'offline', message: 'URL Google Sheets belum diisi' };
                    }

                    const postUrl = targetUrl.includes('?') 
                        ? `${targetUrl}&action=${action}` 
                        : `${targetUrl}?action=${action}`;

                    const response = await fetch(postUrl, {
                        method: 'POST',
                        mode: 'cors',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, data: payload })
                    });
                    
                    const text = await response.text();
                    try { return JSON.parse(text); } catch (e) { return { status: 'success', raw: text }; }
                } catch (error) {
                    console.warn(`Action ${action} result:`, error);
                    return { status: 'offline', message: 'Tersimpan secara lokal (Gagal koneksi server)' };
                }
            }
        };

        const app = {
            currentView: 'dashboard',
            
            init() {
                this.loadLocalStorage();
                this.checkAuth();
                this.syncFromSpreadsheet();
            },

            loadLocalStorage() {
                try {
                    const savedOrders = localStorage.getItem('ykbut_orders');
                    const savedBooks = localStorage.getItem('ykbut_books');
                    const savedUsers = localStorage.getItem('ykbut_users');

                    if (savedOrders) appData.orders = JSON.parse(savedOrders);
                    if (savedBooks) mockBooks = JSON.parse(savedBooks);
                    if (savedUsers) mockUsers = JSON.parse(savedUsers);
                } catch(e) { console.error('LocalStorage error', e); }
            },

            saveLocalStorage() {
                try {
                    localStorage.setItem('ykbut_orders', JSON.stringify(appData.orders));
                    localStorage.setItem('ykbut_books', JSON.stringify(mockBooks));
                    localStorage.setItem('ykbut_users', JSON.stringify(mockUsers));
                } catch(e) { console.error('LocalStorage save error', e); }
            },

            async syncFromSpreadsheet() {
                const badgeText = document.getElementById('sync-status-text');
                const badgeDot = document.getElementById('sync-status-dot');
                const badge = document.getElementById('sync-status-badge');
                const syncIcon = document.getElementById('sync-icon');

                if(syncIcon) syncIcon.classList.add('animate-spin');
                if(badgeText) badgeText.innerText = "Mengecek Koneksi...";

                const serverData = await apiService.fetchAll();

                if(syncIcon) syncIcon.classList.remove('animate-spin');

                if (serverData && serverData.status === 'success') {
                    if (serverData.orders && Array.isArray(serverData.orders) && serverData.orders.length > 0) appData.orders = serverData.orders;
                    if (serverData.books && Array.isArray(serverData.books) && serverData.books.length > 0) mockBooks = serverData.books;
                    if (serverData.users && Array.isArray(serverData.users) && serverData.users.length > 0) mockUsers = serverData.users;

                    this.saveLocalStorage();

                    if(badge) {
                        badge.className = "flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-green-50 text-green-700 border border-green-200 hover:bg-green-100 transition";
                        if(badgeDot) badgeDot.className = "w-2 h-2 rounded-full bg-green-500";
                        if(badgeText) badgeText.innerText = "Terhubung ke Google Sheets";
                    }
                    showToast('Data berhasil disinkronkan dari Google Sheets!', 'success');
                    this.navigate(this.currentView);
                } else {
                    if(badge) {
                        badge.className = "flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 transition";
                        if(badgeDot) badgeDot.className = "w-2 h-2 rounded-full bg-amber-500 animate-ping";
                        if(badgeText) {
                            badgeText.innerText = serverData.status === 'unconfigured' 
                                ? "Belum Terhubung (URL Kosong)" 
                                : "Belum Terhubung (Klik Diagnosa)";
                        }
                    }
                }
            },

            checkAuth() {
                const loginScreen = document.getElementById('login-screen');
                if(!currentUser) {
                    loginScreen.classList.remove('hidden');
                    loginScreen.classList.add('flex');
                } else {
                    loginScreen.classList.add('hidden');
                    loginScreen.classList.remove('flex');
                    
                    document.getElementById('sidebar-user-name').innerText = currentUser.name;
                    document.getElementById('sidebar-user-role').innerText = currentUser.role;

                    const navUsersBtn = document.getElementById('nav-users');
                    if (currentUser.role === 'Administrator') {
                        navUsersBtn.classList.remove('hidden');
                    } else {
                        navUsersBtn.classList.add('hidden');
                    }

                    this.updateDate();
                    this.navigate('dashboard');
                }
            },

            handleLogin(e) {
                e.preventDefault();
                const userVal = document.getElementById('login-username').value;
                const passVal = document.getElementById('login-password').value;
                const errorMsg = document.getElementById('login-error');

                let foundUser = mockUsers.find(u => u.username.toLowerCase() === userVal.toLowerCase() && u.password === passVal);

                // FORCE OVERRIDE LOGIN: 
                // Jika gagal karena memori browser lama (cache), tapi user mengetik 'admin' & '12345', 
                // kita paksa sistem untuk mengizinkan masuk dan me-reset password di cache lokal.
                if (!foundUser && userVal.toLowerCase() === 'admin' && passVal === '12345') {
                    foundUser = mockUsers.find(u => u.username.toLowerCase() === 'admin');
                    if (foundUser) {
                        foundUser.password = '12345'; // Update ke 12345 di runtime memori
                        this.saveLocalStorage();      // Timpa password lama di LocalStorage
                    }
                }

                if (foundUser) {
                    currentUser = foundUser;
                    errorMsg.classList.add('hidden');
                    document.getElementById('form-login').reset();
                    showToast(`Selamat datang, ${currentUser.name}!`, 'success');
                    this.checkAuth();
                } else {
                    errorMsg.classList.remove('hidden');
                }
            },

            logout() {
                currentUser = null;
                showToast('Anda telah keluar dari sistem.');
                this.checkAuth();
            },

            updateDate() {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', options);
            },

            navigate(view, param = null) {
                this.currentView = (view === 'add-book' || view === 'edit-book') ? 'books' : view;
                this.updateNavStyle();
                
                const contentDiv = document.getElementById('app-content');
                const titleElement = document.getElementById('page-title');
                
                contentDiv.innerHTML = '';
                selectedBookIds = [];
                
                if(statusChartInstance) {
                    statusChartInstance.destroy();
                    statusChartInstance = null;
                }

                switch(view) {
                    case 'dashboard':
                        titleElement.innerText = "Dashboard Analitik";
                        titleElement.className = "text-xl font-bold text-gray-800 cursor-pointer hover:text-corp-primary transition";
                        titleElement.onclick = () => app.openSheetConfigModal();
                        titleElement.title = "Klik untuk Pengaturan Koneksi";
                        this.renderDashboard(contentDiv);
                        break;
                    case 'orders':
                        titleElement.innerText = "Data Pemesanan Buku";
                        titleElement.className = "text-xl font-bold text-gray-800";
                        titleElement.onclick = null;
                        titleElement.removeAttribute('title');
                        this.renderOrders(contentDiv);
                        break;
                    case 'add-order':
                        titleElement.innerText = "Input Pesanan Baru";
                        titleElement.className = "text-xl font-bold text-gray-800";
                        titleElement.onclick = null;
                        titleElement.removeAttribute('title');
                        this.renderAddOrder(contentDiv);
                        break;
                    case 'books':
                        titleElement.innerText = "Manajemen Katalog Buku";
                        titleElement.className = "text-xl font-bold text-gray-800";
                        titleElement.onclick = null;
                        titleElement.removeAttribute('title');
                        this.renderBooks(contentDiv);
                        break;
                    case 'add-book':
                        titleElement.innerText = "Tambah Buku Baru";
                        this.renderBookForm(contentDiv);
                        break;
                    case 'edit-book':
                        titleElement.innerText = "Edit Data Buku";
                        this.renderBookForm(contentDiv, param);
                        break;
                    case 'users':
                        if(currentUser && currentUser.role === 'Administrator') {
                            titleElement.innerText = "Manajemen Pengguna Sistem";
                            titleElement.className = "text-xl font-bold text-gray-800";
                            titleElement.onclick = null;
                            titleElement.removeAttribute('title');
                            this.renderUsers(contentDiv);
                        } else {
                            titleElement.innerText = "Akses Ditolak";
                            contentDiv.innerHTML = `<div class="text-center py-20"><i class="ph ph-lock-key text-6xl text-red-500 mb-4"></i><h2 class="text-2xl font-bold text-gray-800">Akses Ditolak</h2><p class="text-gray-500">Anda tidak memiliki otorisasi untuk halaman ini.</p></div>`;
                        }
                        break;
                }
            },

            updateNavStyle() {
                const navs = ['dashboard', 'orders', 'add-order', 'books', 'users'];
                navs.forEach(nav => {
                    const btn = document.getElementById(`nav-${nav}`);

            exportToExcel() {
                let tableHtml = `<table border="1"><tr><th>ID Transaksi</th><th>Tanggal</th><th>Nama Pemesan</th><th>No HP</th><th>Email</th><th>Alamat</th><th>Judul Buku</th><th>Qty</th><th>Harga Satuan</th><th>Ongkos Kirim</th><th>Total Harga</th><th>Status Transaksi</th><th>Status Pembayaran</th><th>DP Amount</th><th>Vendor Ekspedisi</th><th>Nomor Resi</th></tr>`;
                
                appData.orders.forEach(order => {
                    const book = getBook(order.bookId);
                    tableHtml += `<tr><td>${order.id}</td><td>${order.date}</td><td>${order.customerName}</td><td>${order.customerPhone}</td><td>${order.customerEmail || '-'}</td><td>${order.customerAddress}</td><td>${book ? book.title : '-'}</td><td>${order.qty}</td><td>${order.unitPrice}</td><td>${order.shippingCost || 0}</td><td>${order.totalPrice}</td><td>${order.status}</td><td>${order.paymentStatus}</td><td>${order.dpAmount}</td><td>${order.shippingVendor || '-'}</td><td>${order.trackingNumber || '-'}</td></tr>`;
                });
                tableHtml += `</table>`;
                
                const uri = 'data:application/vnd.ms-excel;base64,';
                const template = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body>{table}</body></html>';
                const base64 = function(s) { return window.btoa(unescape(encodeURIComponent(s))) };
                const format = function(s, c) { return s.replace(/{(\w+)}/g, function(m, p) { return c[p]; }) };
                
                const ctx = { worksheet: 'Worksheet', table: tableHtml };
                const link = document.createElement("a");
                link.download = `Data_Pesanan_YKBUT_${new Date().toISOString().slice(0,10)}.xls`;
                link.href = uri + base64(format(template, ctx));
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('Export data ke Excel berhasil!');
            },

                const resi = document.getElementById('modal-resi').value;

                order.status = newOrderStatus;

                const form = document.getElementById('form-add-order');

                const labelTotal = document.getElementById('label-total-price');
                const selectPay = document.getElementById('pay-status');

                const inputDp = document.getElementById('pay-dp');

                const calculateTotal = () => {
                    const price = parseFloat(inputPrice.value) || 0;
                    const qty = parseInt(inputQty.value) || 0;
                    const shipping = parseFloat(inputShipping.value) || 0;
                    const total = (price * qty) + shipping;
                    labelTotal.innerText = formatRupiah(total);
                };

                selectBook.addEventListener('change', (e) => {
                    const selectedOption = e.target.options[e.target.selectedIndex];
                    if(selectedOption.value !== "") {
                        inputPrice.value = selectedOption.getAttribute('data-price');
                        calculateTotal();
                    } else {
                        inputPrice.value = "";
                        labelTotal.innerText = "Rp 0";
                    }
                });

                inputPrice.addEventListener('input', calculateTotal);
                inputQty.addEventListener('input', calculateTotal);
                inputShipping.addEventListener('input', calculateTotal);

                selectPay.addEventListener('change', (e) => {
                    if(e.target.value === PAYMENT_STATUS.DP) {
                        containerDp.classList.remove('hidden');
                        inputDp.setAttribute('required', 'true');
                    } else {
                        containerDp.classList.add('hidden');
                        inputDp.removeAttribute('required');
                        inputDp.value = "";
                    }
                });

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const price = parseFloat(inputPrice.value) || 0;
                    const qty = parseInt(inputQty.value) || 1;
                    const shipping = parseFloat(inputShipping.value) || 0;
                    const total = (price * qty) + shipping;
                    const pStatus = selectPay.value;
                    let dp = 0;
                    
                    if(pStatus === PAYMENT_STATUS.DP) dp = parseFloat(inputDp.value) || 0;
                    else if(pStatus === PAYMENT_STATUS.PAID) dp = total;

                    const newOrder = {
                        id: `ORD-${String(appData.orders.length + 1).padStart(3, '0')}`,
                        date: new Date().toISOString().split('T')[0],
                        customerName: document.getElementById('cust-name').value,
                        customerPhone: document.getElementById('cust-phone').value,
                        customerEmail: document.getElementById('cust-email').value,
                        customerAddress: document.getElementById('cust-address').value,
                        bookId: selectBook.value,
                        qty: qty,
                        unitPrice: price,
                        shippingCost: shipping,
                        totalPrice: total,
                        status: ORDER_STATUS.NEW,
                        paymentStatus: pStatus,
                        dpAmount: dp,
                        shippingVendor: '',
                        trackingNumber: ''
                    };

                    // Kurangi stok buku secara otomatis
                    const book = mockBooks.find(b => b.id === selectBook.value);
                    if (book) {
                        book.stock = Math.max(0, book.stock - qty);
                    }

                    appData.orders.unshift(newOrder);
                    this.saveLocalStorage();
                    showToast('Pesanan dibuat! Menyimpan ke Google Sheets...', 'info');
                    
                    app.navigate('orders');
                    
                    const resOrder = await apiService.sendAction('saveOrder', newOrder);
                    let resBook = null;
                    if (book) {
                        resBook = await apiService.sendAction('saveBook', book);
                    }

                    if(resOrder && resOrder.status === 'success') {

function doGet(e) { return handleRequest(e); }
function doPost(e) { return handleRequest(e); }

function handleRequest(e) {
  var lock = LockService.getScriptLock();
  lock.tryLock(10000);
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var action = e && e.parameter ? e.parameter.action : null;
    var postData = null;
    if (e && e.postData && e.postData.contents) {
      try {
        var parsed = JSON.parse(e.postData.contents);
        action = parsed.action || action;
        postData = parsed.data;
      } catch(err) {}
    }
    var result = {};
    if (action === 'ping') {
      result = { status: 'success', message: 'Koneksi Berhasil!' };
    } else if (action === 'getAllData') {
      result = {
        status: 'success',
        orders: getSheetData(ss, 'Orders'),
        books: getSheetData(ss, 'Books'),
        users: getSheetData(ss, 'Users')
      };
    } else if (action === 'saveOrder') {
      var sheet = getOrCreateSheet(ss, 'Orders', ['id', 'date', 'customerName', 'customerPhone', 'customerEmail', 'customerAddress', 'bookId', 'qty', 'unitPrice', 'shippingCost', 'totalPrice', 'status', 'paymentStatus', 'dpAmount', 'shippingVendor', 'trackingNumber']);
      upsertRow(sheet, 'id', postData.id, [postData.id, postData.date, postData.customerName, postData.customerPhone, postData.customerEmail, postData.customerAddress, postData.bookId, postData.qty, postData.unitPrice, postData.shippingCost || 0, postData.totalPrice, postData.status, postData.paymentStatus, postData.dpAmount, postData.shippingVendor, postData.trackingNumber]);
      result = { status: 'success' };
    } else if (action === 'deleteOrder') {
      var sheet = ss.getSheetByName('Orders');
      if (sheet) {
        var data = sheet.getDataRange().getValues();
        for (var i = data.length - 1; i >= 1; i--) {
          if (String(data[i][0]) === String(postData.id)) sheet.deleteRow(i + 1);
        }
      }
      result = { status: 'success' };
    } else if (action === 'saveBook') {
      var sheet = getOrCreateSheet(ss, 'Books', ['id', 'title', 'author', 'pages', 'category', 'costPrice', 'defaultPrice', 'margin', 'stock']);
      upsertRow(sheet, 'id', postData.id, [postData.id, postData.title, postData.author, postData.pages, postData.category, postData.costPrice, postData.defaultPrice, postData.margin, postData.stock]);
      result = { status: 'success' };
    } else if (action === 'deleteBooksBatch') {
      var sheet = ss.getSheetByName('Books');
      if (sheet) {
        var ids = postData.ids || [];
        var data = sheet.getDataRange().getValues();
        for (var i = data.length - 1; i >= 1; i--) {
          if (ids.indexOf(String(data[i][0])) !== -1) sheet.deleteRow(i + 1);
        }
      }
      result = { status: 'success' };
    } else if (action === 'saveUser') {
      var sheet = getOrCreateSheet(ss, 'Users', ['id', 'username', 'password', 'role', 'name']);
      upsertRow(sheet, 'id', postData.id, [postData.id, postData.username, postData.password, postData.role, postData.name]);
      result = { status: 'success' };
    } else if (action === 'deleteUser') {
      var sheet = ss.getSheetByName('Users');
      if (sheet) {
        var data = sheet.getDataRange().getValues();
        for (var i = data.length - 1; i >= 1; i--) {
          if (String(data[i][0]) === String(postData.id)) sheet.deleteRow(i + 1);
        }
      }
      result = { status: 'success' };
    } else {
      result = { status: 'error', message: 'Action tidak dikenal: ' + action };
    }
    return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  } finally { lock.releaseLock(); }
}

function getSheetData(ss, sheetName) {
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return [];
  var data = sheet.getDataRange().getValues();
  if (data.length <= 1) return [];
  var headers = data[0];
  var rows = [];
  for (var i = 1; i < data.length; i++) {
    var rowObj = {};
    for (var j = 0; j < headers.length; j++) {
      var val = data[i][j];
      if (val instanceof Date) {
        val = Utilities.formatDate(val, ss.getSpreadsheetTimeZone(), "yyyy-MM-dd");
      }
      rowObj[headers[j]] = val;
    }
    rows.push(rowObj);
  }
  return rows;
}

function getOrCreateSheet(ss, sheetName, headers) {
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) {
    sheet = ss.insertSheet(sheetName);
    sheet.appendRow(headers);
  }
  return sheet;
}

function upsertRow(sheet, keyColumnName, keyValue, rowValues) {
  var data = sheet.getDataRange().getValues();
  if (data.length <= 1) { sheet.appendRow(rowValues); return; }
  var headers = data[0];
  var keyIndex = headers.indexOf(keyColumnName);
  for (var i = 1; i < data.length; i++) {
    if (String(data[i][keyIndex]) === String(keyValue)) {
      sheet.getRange(i + 1, 1, 1, rowValues.length).setValues([rowValues]);
      return;
    }
  }
  sheet.appendRow(rowValues);
}`;

                                <div class="mt-4">
                                    <label class="block font-bold text-gray-800 mb-1 text-sm">Kode Apps Script</label>
                                    <textarea readonly class="w-full h-32 px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 text-xs font-mono outline-none resize-none focus:ring-2 focus:ring-corp-primary cursor-pointer" onclick="this.select()" title="Klik untuk menyeleksi seluruh kode">${appsScriptCode}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modal-root').innerHTML = modalHtml;
            },

            saveWebAppUrl() {
                const url = document.getElementById('input-webapp-url').value.trim();
                localStorage.setItem('ykbut_webapp_url', url);
                
                const resultDiv = document.getElementById('diagnostic-result');
                resultDiv.classList.remove('hidden');
                
                if (url) {
                    resultDiv.className = 'mt-3 p-3 rounded-lg text-xs font-mono bg-blue-50 text-blue-700 border border-blue-200';
                    resultDiv.innerHTML = '<i class="ph ph-spinner animate-spin mr-1"></i> Menguji koneksi dengan server Apps Script...';
                    
                    fetch(url + (url.includes('?') ? '&' : '?') + 'action=ping')
                        .then(res => res.json())
                        .then(data => {
                            if(data.status === 'success') {
                                resultDiv.className = 'mt-3 p-3 rounded-lg text-xs font-mono bg-green-50 text-green-700 border border-green-200';
                                resultDiv.innerHTML = '<i class="ph ph-check-circle mr-1"></i> Koneksi Berhasil! Sistem siap terhubung ke Google Sheets.';
                                showToast('Web App URL berhasil disimpan dan divalidasi.', 'success');
                                this.syncFromSpreadsheet();
                            } else {
                                throw new Error('Invalid response');
                            }
                        })
                        .catch(err => {
                            resultDiv.className = 'mt-3 p-3 rounded-lg text-xs font-mono bg-amber-50 text-amber-700 border border-amber-200';
                            resultDiv.innerHTML = '<i class="ph ph-warning mr-1"></i> URL tersimpan, namun pengujian gagal. Pastikan URL benar, disalin dari "Web App", dan aksesnya diatur ke "Anyone".';
                        });
                } else {
                    resultDiv.className = 'mt-3 p-3 rounded-lg text-xs font-mono bg-gray-50 text-gray-700 border border-gray-200';
                    resultDiv.innerHTML = 'URL Google Sheets telah dihapus. Aplikasi berjalan dalam mode lokal offline.';
                    showToast('Web App URL dihapus. Berjalan secara lokal.', 'info');
                    this.syncFromSpreadsheet();
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
